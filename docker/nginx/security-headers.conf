# ============================================================
# Security headers untuk situs statis (ppdb & superadmin).
# Di-include oleh 30-generate-sites.sh pada server block statis.
#
# Next.js (companyprofile) dan FastAPI (api) sudah mengirim header
# keamanan sendiri (lihat next.config.ts headers() & middleware API),
# jadi snippet ini SENGAJA tidak dipakai di server proxy agar header
# tidak terkirim dua kali.
#
# Catatan: bila sebuah `location` mendefinisikan `add_header` sendiri,
# directive add_header yang diwarisi dari server block akan di-reset —
# karena itu setiap location yang punya add_header juga meng-include
# snippet ini.
# ============================================================
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
